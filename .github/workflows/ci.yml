name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gateway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://app:ci-only-password@localhost:5432/gateway_test
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app mocklab
      - run: pytest -q tests/unit tests/db
